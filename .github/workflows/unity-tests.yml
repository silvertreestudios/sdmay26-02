name: Unity Tests

on:
  push:
    branches: [ main, pre-release ]
  pull_request:
    branches: [ main, pre-release ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unity Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [ EditMode, PlayMode ]

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Library folder
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      # Run tests
      - name: Run Unity Tests (${{ matrix.testMode }})
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.2.1f1
          testMode: ${{ matrix.testMode }}
          checkName: Unity Test Results (${{ matrix.testMode }})

      # Upload test results
      - name: Upload Test Results (${{ matrix.testMode }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: ${{ steps.tests.outputs.artifactsPath }}

      # Publish test results for easy viewing
      - name: Publish Test Results (${{ matrix.testMode }})
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unity Tests (${{ matrix.testMode }})
          path: ${{ steps.tests.outputs.artifactsPath }}/**/*.xml
          reporter: dotnet-nunit
